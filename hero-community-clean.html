<!-- COMPANION COMMONS HERO COMMUNITY SECTION -->
<section class="hero-community" aria-labelledby="community-hero-title">
  <div class="community-container">
    <div class="community-visual">
      <!-- Background shapes (decorative) -->
      <div class="community-background"></div>

      <!-- Community network -->
      <div class="community-network">
        <!-- Network path (dotted circle, decorative) -->
        <svg class="community-network-path" viewBox="0 0 400 400" aria-hidden="true">
          <circle cx="200" cy="200" r="130" fill="none" stroke="#88977d" stroke-width="2" stroke-dasharray="6,4" opacity="0.4"/>
        </svg>

        <!-- Center Labrador -->
        <div class="community-center">
          <img
            src="assets/images/center-labrador.jpg"
            alt="A yellow Labrador, a member of the Companion Commons community"
            loading="lazy"
            width="300"
            height="300"
          />
        </div>

        <!-- BUBBLE 1: Human-and-pet outline (12 o'clock area) -->
        <div class="community-bubble community-bubble-1">
          <svg viewBox="0 0 120 120" aria-hidden="true">
            <circle cx="60" cy="60" r="58" fill="#f7f0e6" stroke="#d4af88" stroke-width="2.5"/>
            <!-- Person kneeling with small dog -->
            <circle cx="50" cy="32" r="8" fill="none" stroke="#332e2a" stroke-width="1.5"/>
            <path d="M 50 40 L 50 56" stroke="#332e2a" stroke-width="1.5" fill="none"/>
            <path d="M 42 45 L 58 45" stroke="#332e2a" stroke-width="1.5" fill="none"/>
            <path d="M 50 56 L 42 72" stroke="#332e2a" stroke-width="1.5" fill="none"/>
            <path d="M 50 56 L 58 72" stroke="#332e2a" stroke-width="1.5" fill="none"/>
            <!-- Small dog -->
            <ellipse cx="75" cy="68" rx="12" ry="10" fill="none" stroke="#332e2a" stroke-width="1.5"/>
            <circle cx="85" cy="66" r="5" fill="none" stroke="#332e2a" stroke-width="1.5"/>
            <path d="M 75 58 L 73 48" stroke="#332e2a" stroke-width="1.5" fill="none"/>
          </svg>
        </div>

        <!-- BUBBLE 2: Dog photo (1-2 o'clock) -->
        <div class="community-bubble community-bubble-2">
          <img
            src="assets/images/community-dog-01.jpg"
            alt="A community member's dog"
            loading="lazy"
            width="100"
            height="100"
          />
        </div>

        <!-- BUBBLE 3: Human-and-pet outline (3 o'clock area) -->
        <div class="community-bubble community-bubble-3">
          <svg viewBox="0 0 120 120" aria-hidden="true">
            <circle cx="60" cy="60" r="58" fill="#dcc8b0" stroke="#d4af88" stroke-width="2.5"/>
            <!-- Two people standing with dog between -->
            <circle cx="42" cy="30" r="7" fill="none" stroke="#332e2a" stroke-width="1.5"/>
            <path d="M 42 37 L 42 52" stroke="#332e2a" stroke-width="1.5" fill="none"/>
            <path d="M 36 42 L 48 42" stroke="#332e2a" stroke-width="1.5" fill="none"/>
            <path d="M 42 52 L 36 68" stroke="#332e2a" stroke-width="1.5" fill="none"/>
            <path d="M 42 52 L 48 68" stroke="#332e2a" stroke-width="1.5" fill="none"/>

            <circle cx="78" cy="30" r="7" fill="none" stroke="#332e2a" stroke-width="1.5"/>
            <path d="M 78 37 L 78 52" stroke="#332e2a" stroke-width="1.5" fill="none"/>
            <path d="M 72 42 L 84 42" stroke="#332e2a" stroke-width="1.5" fill="none"/>
            <path d="M 78 52 L 72 68" stroke="#332e2a" stroke-width="1.5" fill="none"/>
            <path d="M 78 52 L 84 68" stroke="#332e2a" stroke-width="1.5" fill="none"/>

            <!-- Dog between them -->
            <ellipse cx="60" cy="70" rx="14" ry="12" fill="none" stroke="#332e2a" stroke-width="1.5"/>
            <circle cx="72" cy="68" r="6" fill="none" stroke="#332e2a" stroke-width="1.5"/>
            <path d="M 60 58 L 58 48" stroke="#332e2a" stroke-width="1.5" fill="none"/>
          </svg>
        </div>

        <!-- BUBBLE 4: Dog photo (3-4 o'clock) -->
        <div class="community-bubble community-bubble-4">
          <img
            src="assets/images/community-dog-02.jpg"
            alt="A community member's dog"
            loading="lazy"
            width="100"
            height="100"
          />
        </div>

        <!-- BUBBLE 5: Human-and-pet outline (5-6 o'clock area) -->
        <div class="community-bubble community-bubble-5">
          <svg viewBox="0 0 120 120" aria-hidden="true">
            <circle cx="60" cy="60" r="58" fill="#f7f0e6" stroke="#d4af88" stroke-width="2.5"/>
            <!-- Older adult walking with dog -->
            <circle cx="45" cy="28" r="8" fill="none" stroke="#332e2a" stroke-width="1.5"/>
            <path d="M 45 36 L 45 52" stroke="#332e2a" stroke-width="1.5" fill="none"/>
            <path d="M 37 42 L 53 42" stroke="#332e2a" stroke-width="1.5" fill="none"/>
            <path d="M 45 52 L 38 70" stroke="#332e2a" stroke-width="1.5" fill="none"/>
            <path d="M 45 52 L 52 70" stroke="#332e2a" stroke-width="1.5" fill="none"/>
            <!-- Dog walking alongside -->
            <ellipse cx="75" cy="62" rx="13" ry="11" fill="none" stroke="#332e2a" stroke-width="1.5"/>
            <circle cx="86" cy="60" r="5.5" fill="none" stroke="#332e2a" stroke-width="1.5"/>
            <path d="M 75 50 L 74 40" stroke="#332e2a" stroke-width="1.5" fill="none"/>
          </svg>
        </div>

        <!-- BUBBLE 6: Dog photo (6 o'clock) -->
        <div class="community-bubble community-bubble-6">
          <img
            src="assets/images/community-dog-03.jpg"
            alt="A community member's dog"
            loading="lazy"
            width="100"
            height="100"
          />
        </div>

        <!-- Invitation bubble (5 o'clock area, separate) -->
        <div class="community-invitation">
          <span aria-hidden="true">+</span>
          <span data-copy="community.invitation">Your companion belongs here.</span>
        </div>
      </div>
    </div>

    <!-- Community message (right side text) -->
    <div class="community-message">
      <p class="eyebrow" data-copy="community.eyebrow">A growing pet health intelligence community</p>
      <h2 id="community-hero-title" data-copy="community.headline">Pet families.<br>Shared purpose.</h2>
      <p data-copy="community.supporting">Real companions. Real experiences.<br>Better understanding—built together.</p>
    </div>
  </div>
</section>
